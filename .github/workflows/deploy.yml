# Push to main -> the server updates itself.
#
# Deliberately plain ssh rather than a marketplace action: this workflow holds
# a key to the box that sends WhatsApp messages to elderly patients, and a
# third-party action is a supply chain into it.
#
# Repository -> Settings -> Secrets and variables -> Actions:
#   DEPLOY_HOST   the server's IP or hostname
#   DEPLOY_USER   ubuntu   (or whatever the box uses)
#   DEPLOY_KEY    the PRIVATE half of a key whose public half is in
#                 ~/.ssh/authorized_keys on the server
#   DEPLOY_PATH   optional, defaults to ~/MedNuskhaV1

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Two deploys at once would fight over the same docker compose project.
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Unit tests
        # No services, no network - see README. If these cannot pass here they
        # will not pass on the server either, and this is the cheaper place to
        # find out.
        run: cd backend && python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Authorise
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd ${{ secrets.DEPLOY_PATH || '~/MedNuskhaV1' }} && ./scripts/deploy.sh"

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
